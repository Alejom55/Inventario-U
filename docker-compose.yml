services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: inventario
      POSTGRES_USER: inventario
      POSTGRES_PASSWORD: inventario
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventario -d inventario"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://inventario:inventario@db:5432/inventario
      DEPORTBACK_API_URL: ${DEPORTBACK_API_URL:-}
      FASTIFY_API_URL: ${FASTIFY_API_URL:-}
      DEPORTBACK_ENTITY_PATH: ${DEPORTBACK_ENTITY_PATH:-}
      FASTIFY_ENTITY_PATH: ${FASTIFY_ENTITY_PATH:-}
      CHAOS_ROUND: ${CHAOS_ROUND:-none}
      APP_REVISION: ${APP_REVISION:-development}
      TEAM_API_KEY: ${TEAM_API_KEY:-}
      RESILIENCE_MODE: ${RESILIENCE_MODE:-baseline}
      DEPORTBACK_TIMEOUT_SECONDS: ${DEPORTBACK_TIMEOUT_SECONDS:-0.5}
      FASTIFY_TIMEOUT_SECONDS: ${FASTIFY_TIMEOUT_SECONDS:-0.5}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
