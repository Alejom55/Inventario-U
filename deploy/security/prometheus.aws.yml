global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files: [/etc/prometheus/identity-alerts.yml]
scrape_configs:
  - job_name: inventory
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics-token
    static_configs:
      - targets: ['e1-api:8000']
        labels: {security_lab: E1}
