name: inventario-security-e1
services:
  db:
    image: postgres:16-alpine
    mem_limit: 128m
    environment:
      POSTGRES_DB: security_e1
      POSTGRES_USER: inventario
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes: [security_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U inventario -d security_e1]
      interval: 5s
      retries: 20
  api:
    image: inventario-security:${APP_REVISION:?immutable revision required}
    build: ../..
    mem_limit: 384m
    cpus: 0.5
    command: [/app/.venv/bin/uvicorn, app.main:app, --host, 0.0.0.0, --port, '8000', --no-access-log]
    environment:
      DATABASE_URL: postgresql://inventario:${POSTGRES_PASSWORD:?required}@db:5432/security_e1
      TEAM_API_KEY: ${TEAM_API_KEY:?required}
      METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:?required}
      APP_REVISION: ${APP_REVISION:?required}
      CHAOS_ROUND: ${CHAOS_ROUND:?required}
      CHAOS_EXECUTION_ID: ${CHAOS_EXECUTION_ID:-none}
      SECURITY_AUTH_MODE: ${SECURITY_AUTH_MODE:?required}
      SECURITY_JWT_PUBLIC_KEY_FILE: /run/identity/issuer-public.pem
      SECURITY_ALLOWED_SUBJECTS: coordinator-demo,security-operator
      SECURITY_HONEYTOKEN_SHA256: ${SECURITY_HONEYTOKEN_SHA256:?required}
      TERMINAL_API_ONLY: 'true'
      RESOURCE_LAB_ENABLED: 'false'
      SECURITY_RESULTS_ENABLED: 'true'
      RESOURCE_ADMIN_KEY: ${RESOURCE_ADMIN_KEY:?separate operator key required}
      CLOUD_PROVIDER: ${CLOUD_PROVIDER:-}
      AWS_INSTANCE_ID: ${AWS_INSTANCE_ID:-}
    volumes: ['../../security/runtime/issuer-public.pem:/run/identity/issuer-public.pem:ro']
    ports: ['127.0.0.1:18300:8000']
    depends_on:
      db: {condition: service_healthy}
    logging:
      options: {max-size: 5m, max-file: '3'}
  prometheus:
    image: prom/prometheus:v3.5.0
    mem_limit: 128m
    command: ['--config.file=/etc/prometheus/prometheus.yml', '--storage.tsdb.retention.time=3h']
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../security/detection/identity-alerts.yml:/etc/prometheus/identity-alerts.yml:ro
      - ../../security/runtime/metrics-token:/etc/prometheus/metrics-token:ro
      - security_prometheus:/prometheus
    ports: ['127.0.0.1:19300:9090']
  grafana:
    image: grafana/grafana:12.1.0
    mem_limit: 160m
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?required}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - security_grafana:/var/lib/grafana
      - ./grafana-provisioning.yml:/etc/grafana/provisioning/dashboards/security.yml:ro
      - ./grafana-datasource.yml:/etc/grafana/provisioning/datasources/security.yml:ro
      - ../../security/dashboard.json:/var/lib/grafana/dashboards/security.json:ro
    ports: ['127.0.0.1:18301:3000']
volumes:
  security_data:
  security_prometheus:
  security_grafana:
