name: Validacion local de caos
run-name: ${{ github.ref_name == 'feat/aws-chaos' && 'Fallo c AWS — estado estable, R0 y R1' || github.ref_name == 'feat/render-free' && 'Fallo c Render Free — estado estable, R0 y R1' || github.workflow }}

on:
  push:
    branches: [feat/chaos-v4]
    paths: ['app/**', 'chaos/**', 'chaos_lab/**', 'scripts/validate_chaos.py', 'tests/chaos/**', 'pyproject.toml', 'uv.lock', '.github/workflows/chaos-foundation.yml']
  pull_request:
    paths: ['app/**', 'chaos/**', 'chaos_lab/**', 'scripts/validate_chaos.py', 'tests/chaos/**', 'pyproject.toml', 'uv.lock', '.github/workflows/chaos-foundation.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v9.0.0
      - run: uv sync --frozen --group dev --group chaos
      - name: Pruebas de resiliencia y contratos del experimento
        run: uv run --frozen --group chaos python -m pytest tests/chaos tests/canary tests/local_team tests/digitalocean --no-cov
      - name: Validar experimento sin inyectar fallos
        run: uv run --frozen --group chaos python -m scripts.validate_chaos --k6
      - name: Verificar Toxiproxy real en contenedores sinteticos locales
        run: uv run --frozen --group chaos python -m scripts.verify_toxiproxy

  render_free:
    if: github.event_name == 'workflow_dispatch' && github.ref_name == 'feat/render-free'
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: inventario-render-free-practice
      cancel-in-progress: false
    env:
      RENDER_CHAOS_API_KEY: ${{ secrets.RENDER_CHAOS_API_KEY }}
      RENDER_CHAOS_ADMIN_KEY: ${{ secrets.RENDER_CHAOS_ADMIN_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v9.0.0
      - run: uv sync --frozen --group chaos
      - name: Esperar API y Prometheus antes de medir
        shell: python
        run: |
          import json, time, urllib.request, urllib.error
          from pathlib import Path
          manifest = json.loads(Path('deploy/render/target.json').read_text())
          for base in (manifest['api_url'], manifest['prometheus_url']):
              for attempt in range(6):
                  try:
                      with urllib.request.urlopen(base + '/health', timeout=25) as response:
                          if response.status == 200:
                              break
                  except (urllib.error.URLError, TimeoutError):
                      pass
                  time.sleep(5)
              else:
                  raise RuntimeError('Servicio Free no disponible antes de medir')
          time.sleep(10)  # Allow two real Prometheus scrapes before the baseline.
      - name: Preparar exclusivamente las credenciales de la API sintetica
        shell: python
        run: |
          import json, os
          from pathlib import Path
          target = Path('deploy/render/target.json')
          manifest = json.loads(target.read_text())
          folder = Path('deploy/render/runtime')
          folder.mkdir(parents=True, exist_ok=True)
          keys = {'TEAM_API_KEY': os.environ['RENDER_CHAOS_API_KEY'], 'RESOURCE_ADMIN_KEY': os.environ['RENDER_CHAOS_ADMIN_KEY']}
          assert all(keys.values()), 'Missing encrypted repository secrets'
          (folder/'credentials.json').write_text(json.dumps(keys))
          (folder/'deployment.json').write_text(json.dumps({'api_url': manifest['api_url'], 'api_service_id': manifest['service_id']}))
      - name: Estado estable, R0 y R1 reales en Render
        run: uv run --frozen --group chaos python -m scripts.run_render_resource --manifest deploy/render/target.json
      - name: Evaluar el objetivo y el guardarrail sin confundir el fallo esperado de R0
        shell: python
        run: |
          import json, os
          from pathlib import Path
          report = json.loads(Path('docs/evidence/render-cloud-results.json').read_text())
          rows = {row['round']: row for row in report['measurements']}
          table = '| Ronda | Exito % | p95 ms | Objetivo | Guardarrail |\n|---|---:|---:|---|---|\n'
          for row in rows.values():
              table += f"| {row['round']} | {row['success_percent']:.3f} | {row['p95_ms']:.3f} | {row['objective_passed']} | {row['guardrail_p95_passed']} |\n"
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('## Ejecucion real de Inventario-U en Render Free\n\n' + table + '\nExecution ID: `' + report['execution_id'] + '`\n')
          assert report['same_profile'] and all(row['rollback_verified'] for row in rows.values())
          assert rows['BASELINE']['objective_passed'], 'Estado estable no cumple exito >=99%'
          assert not rows['R0']['objective_passed'], 'R0 no demuestra la degradacion esperada'
          assert rows['R0']['fault']['injection']['admitted'] == 6
          assert rows['R1']['fault']['injection']['admitted'] == 4
          assert rows['R1']['objective_passed'], 'R1 no cumple la unica metrica objetivo'
          assert rows['R1']['guardrail_p95_passed'], 'R1 cumple exito, pero el guardarrail impide la promocion'
      - name: Comprobar que los artefactos no contienen claves
        id: scan_secrets
        if: always()
        shell: python
        run: |
          import os
          from pathlib import Path
          keys = [os.environ.get('RENDER_CHAOS_API_KEY'), os.environ.get('RENDER_CHAOS_ADMIN_KEY')]
          files = list(Path('chaos/results').rglob('*')) + [Path('docs/evidence/render-cloud-results.json')]
          for file in files:
              if file.is_file():
                  content = file.read_text(errors='replace')
                  assert not any(key and key in content for key in keys), 'Secret found in artifact'
      - name: Descargar evidencia real sin credenciales
        if: always() && steps.scan_secrets.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: render-free-${{ github.run_id }}
          path: |
            chaos/results/render-*/
            docs/evidence/render-cloud-results.json
          if-no-files-found: warn
          retention-days: 14

  aws_free:
    if: github.event_name == 'workflow_dispatch' && github.ref_name == 'feat/aws-chaos'
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: inventario-aws-practice
      cancel-in-progress: false
    env:
      AWS_CHAOS_API_KEY: ${{ secrets.AWS_CHAOS_API_KEY }}
      AWS_CHAOS_ADMIN_KEY: ${{ secrets.AWS_CHAOS_ADMIN_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v9.0.0
      - run: uv sync --frozen --group chaos
      - name: Preparar claves exclusivas de la API sintetica AWS
        shell: python
        run: |
          import json, os, time, urllib.request
          from pathlib import Path
          folder = Path('deploy/aws/runtime')
          folder.mkdir(parents=True, exist_ok=True)
          keys = {'TEAM_API_KEY': os.environ['AWS_CHAOS_API_KEY'], 'RESOURCE_ADMIN_KEY': os.environ['AWS_CHAOS_ADMIN_KEY']}
          assert all(keys.values()), 'Missing encrypted repository secrets'
          (folder/'credentials.json').write_text(json.dumps(keys))
          target = json.loads(Path('deploy/aws/target.json').read_text())
          with urllib.request.urlopen(target['api_url']+'/health', timeout=25) as response:
              assert response.status == 200
          time.sleep(10)
      - name: Estado estable, R0 y R1 reales en AWS
        run: uv run --frozen --group chaos python -m scripts.run_aws_resource
      - name: Verificar objetivo, guardarrail y evidencia sin claves
        id: verify
        if: always()
        shell: python
        run: |
          import json, os
          from pathlib import Path
          report = json.loads(Path('docs/evidence/aws-cloud-results.json').read_text())
          rows = {row['round']: row for row in report['measurements']}
          table = '| Ronda | Exito % | p95 ms |\n|---|---:|---:|\n'
          for row in rows.values():
              table += f"| {row['round']} | {row['success_percent']:.3f} | {row['p95_ms']:.3f} |\n"
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('## Fallo c real en AWS\n\n'+table+'\nExecution ID: `'+report['execution_id']+'`\n')
          keys = [os.environ.get('AWS_CHAOS_API_KEY'), os.environ.get('AWS_CHAOS_ADMIN_KEY')]
          files = list(Path('chaos/results').rglob('*')) + [Path('docs/evidence/aws-cloud-results.json')]
          for file in files:
              if file.is_file():
                  content = file.read_text(errors='replace')
                  assert not any(key and key in content for key in keys), 'Secret found in artifact'
          assert report['same_profile'] and all(row['rollback_verified'] for row in rows.values())
          assert rows['BASELINE']['objective_passed']
          assert not rows['R0']['objective_passed'] and rows['R0']['fault']['injection']['admitted'] == 6
          assert rows['R1']['fault']['injection']['admitted'] == 4
          assert rows['R1']['objective_passed'] and rows['R1']['guardrail_p95_passed']
      - name: Descargar evidencia AWS
        if: always() && steps.verify.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: aws-chaos-${{ github.run_id }}
          path: |
            chaos/results/aws-*/
            docs/evidence/aws-cloud-results.json
          retention-days: 14
