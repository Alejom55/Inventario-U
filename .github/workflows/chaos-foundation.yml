name: Validacion local de caos
run-name: ${{ github.ref_name == 'feat/render-free' && 'Fallo c Render Free — estado estable, R0 y R1' || github.workflow }}

on:
  push:
    branches: [feat/chaos-v4]
    paths: ['app/**', 'chaos/**', 'chaos_lab/**', 'scripts/validate_chaos.py', 'tests/chaos/**', 'pyproject.toml', 'uv.lock', '.github/workflows/chaos-foundation.yml']
  pull_request:
    paths: ['app/**', 'chaos/**', 'chaos_lab/**', 'scripts/validate_chaos.py', 'tests/chaos/**', 'pyproject.toml', 'uv.lock', '.github/workflows/chaos-foundation.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v9.0.0
      - run: uv sync --frozen --group dev --group chaos
      - name: Pruebas de resiliencia y contratos del experimento
        run: uv run --frozen --group chaos python -m pytest tests/chaos tests/canary --no-cov
      - name: Validar experimento sin inyectar fallos
        run: uv run --frozen --group chaos python -m scripts.validate_chaos --k6
      - name: Verificar Toxiproxy real en contenedores sinteticos locales
        run: uv run --frozen --group chaos python -m scripts.verify_toxiproxy

  render_free:
    if: github.event_name == 'workflow_dispatch' && github.ref_name == 'feat/render-free'
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: inventario-render-free-practice
      cancel-in-progress: false
    env:
      RENDER_CHAOS_API_KEY: ${{ secrets.RENDER_CHAOS_API_KEY }}
      RENDER_CHAOS_ADMIN_KEY: ${{ secrets.RENDER_CHAOS_ADMIN_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v9.0.0
      - run: uv sync --frozen --group chaos
      - name: Preparar exclusivamente las credenciales de la API sintetica
        shell: python
        run: |
          import json, os
          from pathlib import Path
          target = Path('deploy/render/target.json')
          manifest = json.loads(target.read_text())
          folder = Path('deploy/render/runtime')
          folder.mkdir(parents=True, exist_ok=True)
          keys = {'TEAM_API_KEY': os.environ['RENDER_CHAOS_API_KEY'], 'RESOURCE_ADMIN_KEY': os.environ['RENDER_CHAOS_ADMIN_KEY']}
          assert all(keys.values()), 'Missing encrypted repository secrets'
          (folder/'credentials.json').write_text(json.dumps(keys))
          (folder/'deployment.json').write_text(json.dumps({'api_url': manifest['api_url'], 'api_service_id': manifest['service_id']}))
      - name: Estado estable, R0 y R1 reales en Render
        run: uv run --frozen --group chaos python -m scripts.run_render_resource --manifest deploy/render/target.json
      - name: Comprobar que los artefactos no contienen claves
        id: scan_secrets
        if: always()
        shell: python
        run: |
          import os
          from pathlib import Path
          keys = [os.environ.get('RENDER_CHAOS_API_KEY'), os.environ.get('RENDER_CHAOS_ADMIN_KEY')]
          files = list(Path('chaos/results').rglob('*')) + [Path('docs/evidence/render-cloud-results.json')]
          for file in files:
              if file.is_file():
                  content = file.read_text(errors='replace')
                  assert not any(key and key in content for key in keys), 'Secret found in artifact'
      - name: Descargar evidencia real sin credenciales
        if: always() && steps.scan_secrets.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: render-free-${{ github.run_id }}
          path: |
            chaos/results/render-*/
            docs/evidence/render-cloud-results.json
          if-no-files-found: warn
          retention-days: 14
